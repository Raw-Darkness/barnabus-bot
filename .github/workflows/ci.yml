name: tests

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python: ["3.12", "3.14"]   # 3.14 = production server (Ubuntu 26.04); 3.12 = container image
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: python -m compileall -q barnabus
      - run: python -m pytest -q

  image:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t barnabus:ci .
      - name: import smoke test
        run: docker run --rm -e BOT_CONFIG=/app/Config.example.json barnabus:ci python -c "import barnabus.app"
