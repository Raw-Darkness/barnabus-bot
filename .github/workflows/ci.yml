name: tests

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"   # matches the production server (Ubuntu 24.04)
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: python -m compileall -q barnabus
      - run: python -m pytest -q
